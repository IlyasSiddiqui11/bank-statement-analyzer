services:
  - type: web
    name: bank-statement-analyzer-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./bank-statement-analyzer
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENV
        value: SANDBOX
      - key: CASHFREE_API_VERSION
        value: "2023-08-01"
      - key: CASHFREE_MINIMUM_ORDER_PAISE
        value: "100"
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BACKEND_URL
        sync: false
  - type: web
    name: banklens-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_REGISTERED_BUSINESS_NAME
        sync: false
      - key: VITE_SUPPORT_EMAIL
        sync: false
      - key: VITE_SUPPORT_ADDRESS
        sync: false
      - key: VITE_SUPPORT_HOURS
        sync: false
