
spring.application.name=bank-statement-analyzer
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties],optional:file:bank-statement-analyzer/.env[.properties]

# Razorpay configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Configure FRONTEND_ORIGIN to the deployed frontend origin in production.
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}

razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
app.session.ttl-minutes=${SESSION_TTL_MINUTES:30}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

