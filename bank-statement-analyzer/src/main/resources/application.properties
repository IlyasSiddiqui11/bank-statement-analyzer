
spring.application.name=bank-statement-analyzer
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties],optional:file:bank-statement-analyzer/.env[.properties]

# Cashfree configuration
cashfree.app.id=${CASHFREE_APP_ID}
cashfree.secret.key=${CASHFREE_SECRET_KEY}
cashfree.api.version=${CASHFREE_API_VERSION}
cashfree.env=${CASHFREE_ENV:PRODUCTION}
cashfree.minimum-order-paise=${CASHFREE_MINIMUM_ORDER_PAISE}
app.frontend.url=${FRONTEND_URL:https://banklens-ztge.onrender.com}
app.backend.url=${BACKEND_URL:https://bank-lens-backend.onrender.com}

# Configure FRONTEND_ORIGIN to the deployed frontend origin in production.
app.cors.allowed-origins=${FRONTEND_ORIGIN:https://banklens-ztge.onrender.com}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}

app.session.ttl-minutes=${SESSION_TTL_MINUTES:30}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

